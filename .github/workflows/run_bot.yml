name: Daily Trading Bot

on:
  schedule:
    - cron: '50 20 * * 1-5'
  workflow_dispatch:

jobs:
  run-trading-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          
          # HIER IST DER FIX:
          # 1. Wir installieren alles "Normale"
          pip install pandas numpy scipy scikit-learn torch matplotlib yfinance python-dotenv pyarrow
          
          # 2. Wir erzwingen: NEUESTE Alpaca API + ALTE Alpha Vantage (damit beides klappt)
          pip install "alpaca-trade-api>=3.1.0" "alpha-vantage==2.3.1"
          
          # 3. Dein Projekt
          pip install -e .

      - name: Run Trading Pipeline
        env:
          ALPACA_KEY: ${{ secrets.ALPACA_KEY }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET }}
          ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
          PYTHONPATH: src
        run: |
          echo "--- 1. Downloading Data ---"
          python src/ai_ls_allocation/data/download.py
          
          echo "--- 2. Cleaning Data ---"
          python src/ai_ls_allocation/data/clean.py
          
          echo "--- 3. Building Features ---"
          python src/ai_ls_allocation/features/build.py
          
          echo "--- 4. AI Training & Optimization ---"
          python src/ai_ls_allocation/engine/bt_neural.py
          
          echo "--- 5. Executing Trades (Paper) ---"
          python src/ai_ls_allocation/execution.py
