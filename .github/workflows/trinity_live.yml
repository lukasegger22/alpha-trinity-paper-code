name: Trinity V3 Live Trading

on:
  workflow_dispatch:
  schedule:
    - cron: '45 20 * * 1-5'

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create Data Directories
      run: |
        mkdir -p data/features
        mkdir -p models
        mkdir -p logs
        mkdir -p reports

    - name: Run Trinity Pipeline
      run: |
        export PYTHONPATH="${PYTHONPATH}:."
        python src/run_pipeline.py

    - name: Execute Alpaca Paper Trades
      env:
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        ALPACA_ENDPOINT: ${{ secrets.ALPACA_ENDPOINT }}
        IS_CLOUD_RUN: "True"
      run: |
        export PYTHONPATH="${PYTHONPATH}:."
        python src/ai_ls_allocation/execution.py

    - name: Upload Daily Logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trinity-daily-logs
        path: |
          logs/
          data/features/trinity_signals.csv
          data/features/trinity_signals.parquet
          data/features/trinity_history.parquet
          reports/
