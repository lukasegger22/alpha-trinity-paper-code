name: 🏦 Trinity V3 Live Trading

on:
  # 1. Manuell startbar (Button auf GitHub)
  workflow_dispatch:
  
  # 2. Automatisch Mo-Fr um 20:45 UTC (ca. 15 Minuten vor US-Close)
  schedule:
    - cron: '45 20 * * 1-5'

jobs:
  trade:
    runs-on: ubuntu-latest
    
    steps:
    # Code herunterladen
    - name: Checkout repository
      uses: actions/checkout@v3

    # Python 3.9 aufsetzen
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    # Bibliotheken installieren
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Ordner für Daten erstellen (Wichtig für Parquet files)
    - name: Create Data Directories
      run: |
        mkdir -p data/features
        mkdir -p models

    # --- HIER STARTET DEIN BOT ---
    # Er führt erst den Data Download aus, dann das Training, dann den Trade
    - name: Run Trinity Pipeline
      env:
        # Hier holen wir die Schlüssel aus den GitHub Secrets
        APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
        APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        APCA_API_BASE_URL: "https://paper-api.alpaca.markets"
      run: |
        # Stelle sicher, dass wir im richtigen Verzeichnis sind
        export PYTHONPATH=$PYTHONPATH:.
        
        # 1. Pipeline starten (Download -> Train -> Trade)
        # Passe den Pfad an, falls dein Hauptscript woanders liegt!
        python src/run_pipeline.py